name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      # Base governance relay: separate profile (solc 0.8.25) compiling only gov-relay/.
      - name: Run Forge fmt (gov-relay)
        run: forge fmt --check
        env:
          FOUNDRY_PROFILE: gov-relay

      - name: Run Forge build (gov-relay)
        run: forge build --sizes
        env:
          FOUNDRY_PROFILE: gov-relay

      - name: Run Forge tests (gov-relay)
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: gov-relay
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
